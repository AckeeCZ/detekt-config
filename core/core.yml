complexity:
  CyclomaticComplexMethod:
    excludes: ['**Test.kt', '**Tests.kt', '**TestSuite.kt']
  LongMethod:
    ignoreAnnotated: ['Composable', 'TestDataFactory']
    excludes: ['**Test.kt', '**Tests.kt', '**TestSuite.kt']
  LongParameterList:
    ignoreAnnotated: ['Composable', 'TestDataFactory']
  TooManyFunctions:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

ktlint:
  ArgumentListWrapping:
    maxLineLength: 150
  ClassSignature:
    active: false
  CommentWrapping:
    active: false
  ContextReceiverMapping:
    maxLineLength: 150
  FunctionExpressionBody:
    active: false
  FunctionReturnTypeSpacing:
    maxLineLength: 150
  FunctionSignature:
    active: false
  MaximumLineLength:
    maxLineLength: 150
  ParameterListSpacing:
    maxLineLength: 150
  ParameterListWrapping:
    maxLineLength: 150
  ParameterWrapping:
    maxLineLength: 150
  PropertyWrapping:
    maxLineLength: 150
  Wrapping:
    maxLineLength: 150

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  AbstractClassCanBeConcreteClass:
    active: false
  AbstractClassCanBeInterface:
    active: false
  MaxLineLength:
    maxLineLength: 150
  UnusedPrivateFunction:
    ignoreAnnotated: [ 'Preview' ]
  UnusedPrivateProperty:
    ignoreAnnotated: [ 'Preview' ]
